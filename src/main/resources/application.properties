# ============================================================
# DevVault Backend Configuration
# Every value can be overridden with an environment variable.
# ============================================================

# --- Database ---
# Configure these in Railway / environment variables.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Server ---
server.port=${PORT:${SERVER_PORT:8080}}
server.error.include-message=never

# --- File uploads (JARs can be large) ---
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=210MB

# --- DevVault custom settings ---
devvault.storage.location=${STORAGE_LOCATION:./storage}
devvault.jwt.secret=${JWT_SECRET}
devvault.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
devvault.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Auth cookie ---
# Set SameSite=None + Secure=true when frontend and backend are on different
# domains (e.g. deployed separately on Render)
devvault.cookie.same-site=${COOKIE_SAMESITE:Lax}
devvault.cookie.secure=${COOKIE_SECURE:false}

# --- Maven Central proxy ---
# When a dependency is requested that is not in the local registry,
# fetch it from this remote repository, store it locally, and serve it.
devvault.remote.enabled=${REMOTE_PROXY_ENABLED:true}
devvault.remote.url=${REMOTE_PROXY_URL:https://repo1.maven.org/maven2}
devvault.remote.connect-timeout-ms=${REMOTE_PROXY_CONNECT_TIMEOUT:5000}
devvault.remote.read-timeout-ms=${REMOTE_PROXY_READ_TIMEOUT:30000}

# --- Logging ---
logging.level.com.company.devvault=INFO
logging.level.org.hibernate.SQL=WARN