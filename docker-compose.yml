services:
  devvault:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/devvault?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: devvault
      DB_PASSWORD: devvault123
      DB_DRIVER: com.mysql.cj.jdbc.Driver
      STORAGE_LOCATION: /app/storage
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - devvault-storage:/app/storage
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8
    environment:
      MYSQL_DATABASE: devvault
      MYSQL_USER: devvault
      MYSQL_PASSWORD: devvault123
      MYSQL_ROOT_PASSWORD: root123
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123"]
      interval: 5s
      timeout: 5s
      retries: 15

volumes:
  devvault-storage:
  mysql-data: